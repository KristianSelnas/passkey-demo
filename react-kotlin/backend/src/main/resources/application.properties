# Server Configuration
server.port=8080

# H2 in-memory database (data is cleared on restart)
spring.datasource.url=jdbc:h2:mem:passkeydb
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
# All entity access happens in transactional services, so no session is kept open during rendering
spring.jpa.open-in-view=false

# WebAuthn Configuration
webauthn.rp.name=Passkey Demo
webauthn.rp.id=localhost
webauthn.origin=http://localhost:3000

# JWT Configuration
# The secret is base64-encoded and must be at least 256 bits. Set JWT_SECRET outside of local demo use.
# Generate with: openssl rand -base64 32
jwt.secret=${JWT_SECRET:ErHKnpCHgEXrUX1yP9jUBFADQM1HuKxlWlkmBh/RK3w=}
jwt.expiration=2h
