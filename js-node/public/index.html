<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passkey Demo - Logg inn</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="demo-ribbon">Passkey demo</div>
    <div class="container">
      <h1>Logg inn</h1>
      <p class="subtitle">Logg inn med passkey</p>

      <form id="login-form">
        <div class="form-group">
          <label for="username">E-postadresse</label>
          <input
            type="email"
            id="username"
            placeholder="din@epost.no"
            autocomplete="username webauthn email"
            required
          />
        </div>
        <button type="submit" class="btn-primary">Logg inn</button>
      </form>

      <div id="status"></div>

      <p class="register-link">
        Første gang? <a href="register.html">Registrer deg her</a>
      </p>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
