<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passkey Demo - Registrering</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="demo-ribbon">Passkey demo</div>
    <div class="container">
      <h1>Registrer bruker</h1>
      <p class="subtitle">Registrer en ny bruker med passkey</p>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Navn</label>
          <input
            type="text"
            id="name"
            placeholder="Ditt fulle navn"
            autocomplete="name"
            required
          />
        </div>
        <div class="form-group">
          <label for="username">E-postadresse</label>
          <input
            type="email"
            id="username"
            placeholder="din@epost.no"
            autocomplete="username webauthn email"
            required
          />
        </div>
        <button type="submit" class="btn-primary">Registrer</button>
      </form>

      <div id="status"></div>

      <p class="register-link">
        Har du allerede en konto? <a href="index.html">Logg inn her</a>
      </p>
    </div>

    <script type="module" src="register.js"></script>
  </body>
</html>
